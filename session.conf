new_tab tool
layout splits
cd ~
launch zsh -c "trans -x 127.0.0.1:7892 :en+zh || zsh"
launch --location=vsplit --bias=45 zsh -c "ghci || zsh"
launch --location=hsplit --bias=65 zsh
