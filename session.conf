new_tab main
layout splits
cd ~
launch --var window=first zsh
launch --location=vsplit --bias=40 zsh -c "peaclock || clock-rs || tty-clock -c || zsh"
launch --location=hsplit --bias=75 zsh
focus_matching_window var:window=first

new_tab work
layout splits
cd ~/Workspace/
launch --var window=first zsh
launch --location=vsplit zsh
focus_matching_window var:window=first

